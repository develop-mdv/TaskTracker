name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          # Building the production image on the VPS can exceed the 10m default.
          command_timeout: 30m
          script: |
            set -e
            cd ~/TaskTracker
            git pull
            # Rebuild and restart app container (ensures latest code is used)
            docker compose --profile production up -d --build app
            # Ensure nginx is up (up -d --no-deps preserves external network connections)
            docker compose --profile production up -d --no-deps nginx
            # Ensure nginx stays connected to shared-web network (needed for korpmes.ru proxy)
            docker network connect shared-web tasktracker-nginx-1 2>/dev/null || true
            # Install and verify cron jobs for recurring tasks and cleanup
            chmod +x scripts/setup-cron.sh
            APP_URL=http://localhost:3000 ./scripts/setup-cron.sh
            # Prune unused images to save space
            docker image prune -f
